<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>班級音量表</title>
<style>
  :root{
    --blue:#2f7bf6;  --blue-soft:#dbe8ff;
    --green:#22b463; --green-soft:#d6f5e3;
    --purple:#9b4df0;--purple-soft:#ecdcff;
    --red:#ef3b3b;   --red-soft:#ffdcdc;
    --ink:#1d2433;
    --accent:var(--blue);
    --accent-soft:var(--blue-soft);
    --face:var(--blue);
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; margin:0; }
  body{
    font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif;
    color:var(--ink);
    background:
      radial-gradient(120% 90% at 50% -10%, var(--accent-soft) 0%, #ffffff 60%);
    transition:background 1.1s ease;
    -webkit-user-select:none; user-select:none;
    touch-action:manipulation;
    overflow:hidden;
  }

  .stage{
    height:100dvh; min-height:100%;
    display:flex; flex-direction:column;
    align-items:center; justify-content:space-between;
    padding:clamp(14px,3vmin,32px);
    gap:clamp(8px,2vmin,20px);
  }

  /* 頂部：班級名 + 狀態詞 */
  .top{ width:100%; text-align:center; }
  .room{
    font-size:clamp(15px,2.6vmin,22px); font-weight:700;
    letter-spacing:.12em; color:#7b8499;
  }
  .status{
    margin-top:.15em;
    font-size:clamp(42px,11vmin,120px); font-weight:900;
    line-height:1; color:var(--accent);
    transition:color .5s ease;
  }

  /* 中央大圓臉 */
  .face-wrap{
    flex:1; width:100%;
    display:flex; align-items:center; justify-content:center;
    min-height:0;
  }
  svg.face{
    width:min(70vmin,560px); height:min(70vmin,560px);
    display:block;
    filter:drop-shadow(0 18px 36px rgba(40,60,110,.18));
    transition:transform .12s ease;
  }

  /* 音量條 */
  .meter{ width:min(92%,640px); }
  .bar{
    position:relative; height:clamp(16px,3.2vmin,26px);
    border-radius:999px; overflow:hidden;
    background:linear-gradient(90deg,
      var(--blue) 0%, var(--blue) 25%,
      var(--green) 25%, var(--green) 50%,
      var(--purple) 50%, var(--purple) 75%,
      var(--red) 75%, var(--red) 100%);
    box-shadow:inset 0 1px 3px rgba(0,0,0,.18);
    opacity:.85;
  }
  .needle{
    position:absolute; top:-6px; bottom:-6px; left:0%;
    width:5px; border-radius:6px; background:#1d2433;
    box-shadow:0 0 0 3px #fff, 0 4px 8px rgba(0,0,0,.25);
    transform:translateX(-50%);
    transition:left .08s linear;
  }
  .ticks{
    display:flex; justify-content:space-between;
    margin-top:6px; font-size:clamp(12px,2vmin,16px);
    font-weight:700; color:#9aa3b5;
  }
  .ticks span{ width:25%; text-align:center; }

  /* 底部控制列 */
  .controls{
    width:min(96%,720px);
    display:flex; flex-wrap:wrap; align-items:center; justify-content:center;
    gap:clamp(8px,1.8vmin,16px);
  }
  button.ctrl{
    border:none; cursor:pointer;
    font-family:inherit; font-weight:800;
    font-size:clamp(15px,2.4vmin,20px);
    padding:clamp(11px,1.8vmin,16px) clamp(18px,3vmin,28px);
    border-radius:16px; color:#fff; background:var(--accent);
    box-shadow:0 6px 16px rgba(40,60,110,.22);
    transition:transform .12s ease, background .5s ease, opacity .2s;
  }
  button.ctrl:active{ transform:scale(.95); }
  button.ctrl.ghost{
    background:#fff; color:var(--ink);
    box-shadow:inset 0 0 0 2px #e2e6ef, 0 4px 12px rgba(40,60,110,.08);
  }
  .sens{
    display:flex; align-items:center; gap:10px;
    background:#fff; padding:8px 16px; border-radius:16px;
    box-shadow:inset 0 0 0 2px #e2e6ef;
  }
  .sens label{ font-weight:800; font-size:clamp(13px,2vmin,17px); color:#5a6275; white-space:nowrap; }
  .sens input[type=range]{ width:clamp(110px,22vmin,200px); accent-color:var(--accent); }

  .toggle{
    display:flex; align-items:center; gap:8px;
    background:#fff; padding:10px 16px; border-radius:16px;
    box-shadow:inset 0 0 0 2px #e2e6ef;
    font-weight:800; font-size:clamp(13px,2vmin,17px); color:#5a6275;
    cursor:pointer;
  }
  .toggle input{ width:20px; height:20px; accent-color:var(--accent); }

  /* 開始 / 錯誤畫面 */
  .overlay{
    position:fixed; inset:0; z-index:10;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:24px; gap:18px;
    background:radial-gradient(120% 90% at 50% 10%, #dbe8ff 0%, #ffffff 70%);
  }
  .overlay.hidden{ display:none; }
  .overlay h1{ font-size:clamp(30px,7vmin,64px); font-weight:900; margin:0; color:var(--ink); }
  .overlay p{ font-size:clamp(15px,2.6vmin,22px); color:#5a6275; max-width:30ch; margin:0; line-height:1.6; }
  .big-start{
    margin-top:8px; border:none; cursor:pointer; color:#fff;
    font-family:inherit; font-weight:900; font-size:clamp(22px,4vmin,32px);
    padding:clamp(16px,2.4vmin,22px) clamp(40px,7vmin,72px);
    border-radius:24px; background:var(--blue);
    box-shadow:0 12px 28px rgba(47,123,246,.4);
    transition:transform .12s ease;
  }
  .big-start:active{ transform:scale(.95); }
  .hint{ font-size:clamp(12px,2vmin,15px); color:#9aa3b5; max-width:34ch; }
  .err{ color:var(--red); font-weight:800; }
</style>
</head>
<body>

  <!-- 開始畫面（iOS 必須由使用者點擊才能開麥克風） -->
  <div class="overlay" id="overlay">
    <h1>班級音量表</h1>
    <p>把麥克風變成一張大臉。<br>越安靜越藍、越吵越紅。</p>
    <button class="big-start" id="startBtn">點我開始</button>
    <div class="hint" id="hint">點擊後請允許使用麥克風。本工具只即時偵測音量，不會錄音、不會儲存或傳送任何聲音。</div>
  </div>

  <!-- 主畫面 -->
  <div class="stage" id="stage" hidden>
    <div class="top">
      <div class="room" id="roomName">507 班</div>
      <div class="status" id="statusText">安靜</div>
    </div>

    <div class="face-wrap">
      <svg class="face" id="faceSvg" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
        <!-- 臉 -->
        <circle id="faceCircle" cx="120" cy="120" r="96" fill="var(--blue)"/>
        <circle cx="120" cy="120" r="96" fill="none" stroke="rgba(0,0,0,.10)" stroke-width="4"/>
        <ellipse cx="92" cy="86" rx="40" ry="26" fill="rgba(255,255,255,.16)"/>
        <!-- 腮紅 -->
        <circle id="cheekL" cx="78" cy="146" r="13" fill="#ff9aa8" opacity="0"/>
        <circle id="cheekR" cx="162" cy="146" r="13" fill="#ff9aa8" opacity="0"/>
        <!-- 眉毛 -->
        <line id="browL" x1="74" y1="86" x2="104" y2="86" stroke="#23304d" stroke-width="7" stroke-linecap="round" opacity="0"/>
        <line id="browR" x1="166" y1="86" x2="136" y2="86" stroke="#23304d" stroke-width="7" stroke-linecap="round" opacity="0"/>
        <!-- 眼睛：圓點（醒著/生氣） -->
        <circle id="eyeDotL" cx="90" cy="104" r="9" fill="#23304d"/>
        <circle id="eyeDotR" cx="150" cy="104" r="9" fill="#23304d"/>
        <!-- 眼睛：開心彎弧（笑眼） -->
        <path id="eyeArcL" d="M78 106 Q90 92 102 106" fill="none" stroke="#23304d" stroke-width="7" stroke-linecap="round"/>
        <path id="eyeArcR" d="M138 106 Q150 92 162 106" fill="none" stroke="#23304d" stroke-width="7" stroke-linecap="round"/>
        <!-- 嘴：閉合唇線 -->
        <path id="mouthLips" d="M88 158 Q120 184 152 158" fill="none" stroke="#23304d" stroke-width="8" stroke-linecap="round"/>
        <!-- 嘴：張開（大叫） -->
        <ellipse id="mouthOpen" cx="120" cy="166" rx="22" ry="10" fill="#5a1722" opacity="0"/>
      </svg>
    </div>

    <div class="meter">
      <div class="bar"><div class="needle" id="needle"></div></div>
      <div class="ticks"><span>安靜</span><span>普通</span><span>有點吵</span><span>太吵</span></div>
    </div>

    <div class="controls">
      <button class="ctrl ghost" id="stopBtn">停止</button>
      <div class="sens">
        <label>靈敏度</label>
        <input type="range" id="sens" min="1" max="10" step="1" value="5">
      </div>
      <label class="toggle"><input type="checkbox" id="soundToggle">太吵提醒音</label>
      <button class="ctrl ghost" id="fsBtn">全螢幕</button>
    </div>
  </div>

<script>
(function(){
  "use strict";

  // ---- 元素 ----
  const overlay   = document.getElementById('overlay');
  const startBtn  = document.getElementById('startBtn');
  const hint      = document.getElementById('hint');
  const stage     = document.getElementById('stage');
  const statusEl  = document.getElementById('statusText');
  const needle    = document.getElementById('needle');
  const sensInput = document.getElementById('sens');
  const soundTgl  = document.getElementById('soundToggle');
  const stopBtn   = document.getElementById('stopBtn');
  const fsBtn     = document.getElementById('fsBtn');
  const faceSvg   = document.getElementById('faceSvg');

  const faceCircle= document.getElementById('faceCircle');
  const cheekL=document.getElementById('cheekL'), cheekR=document.getElementById('cheekR');
  const browL=document.getElementById('browL'),  browR=document.getElementById('browR');
  const eyeDotL=document.getElementById('eyeDotL'), eyeDotR=document.getElementById('eyeDotR');
  const eyeArcL=document.getElementById('eyeArcL'), eyeArcR=document.getElementById('eyeArcR');
  const mouthLips=document.getElementById('mouthLips'), mouthOpen=document.getElementById('mouthOpen');

  // ---- 設定（記住靈敏度與提醒音）----
  try{
    const s=localStorage.getItem('nm_sens'); if(s) sensInput.value=s;
    const a=localStorage.getItem('nm_alert'); if(a==='1') soundTgl.checked=true;
  }catch(e){}

  // ---- 區間定義（純色，用於文字與背景）----
  const ZONES = [
    {max:0.25, label:'安靜',   var:'--blue',   soft:'--blue-soft'},
    {max:0.50, label:'普通',   var:'--green',  soft:'--green-soft'},
    {max:0.75, label:'有點吵', var:'--purple', soft:'--purple-soft'},
    {max:1.01, label:'太吵了！',var:'--red',    soft:'--red-soft'}
  ];

  // ---- 臉部關鍵格（放在各區間中心，做連續漸變）----
  // happy=笑眼程度 1→0 ; mouth=唇線弧度(+笑/-哭) ; open=張嘴 ; brow=眉毛濃度 ; browTilt=內側下垂角(+生氣/-擔心) ; cheek=腮紅
  const FACES = [
    {lvl:0.125, color:'#2f7bf6', happy:1.0, mouth: 26, open:0.00, brow:0.0, browTilt:-2, cheek:1.0}, // 笑
    {lvl:0.375, color:'#22b463', happy:0.5, mouth: 12, open:0.00, brow:0.0, browTilt: 0, cheek:0.4}, // 平靜
    {lvl:0.625, color:'#9b4df0', happy:0.0, mouth:-6,  open:0.18, brow:0.6, browTilt:-7, cheek:0.0}, // 擔心
    {lvl:0.875, color:'#ef3b3b', happy:0.0, mouth:-18, open:0.65, brow:1.0, browTilt:16, cheek:0.0}  // 生氣
  ];

  // ---- 顏色工具 ----
  function hx(c){ c=c.replace('#',''); return [parseInt(c.slice(0,2),16),parseInt(c.slice(2,4),16),parseInt(c.slice(4,6),16)]; }
  function mix(a,b,t){ const A=hx(a),B=hx(b); return 'rgb('+Math.round(A[0]+(B[0]-A[0])*t)+','+Math.round(A[1]+(B[1]-A[1])*t)+','+Math.round(A[2]+(B[2]-A[2])*t)+')'; }
  function lerp(a,b,t){ return a+(b-a)*t; }

  function faceAt(level){
    const c = Math.max(FACES[0].lvl, Math.min(FACES[FACES.length-1].lvl, level));
    let i=0; while(i<FACES.length-1 && c>FACES[i+1].lvl) i++;
    const a=FACES[i], b=FACES[Math.min(i+1,FACES.length-1)];
    const t = a===b?0:(c-a.lvl)/(b.lvl-a.lvl);
    return {
      color: mix(a.color,b.color,t),
      happy: lerp(a.happy,b.happy,t),
      mouth: lerp(a.mouth,b.mouth,t),
      open:  lerp(a.open,b.open,t),
      brow:  lerp(a.brow,b.brow,t),
      browTilt: lerp(a.browTilt,b.browTilt,t),
      cheek: lerp(a.cheek,b.cheek,t)
    };
  }

  let lastZone=-1;
  function applyZone(level){
    let z=0; for(let i=0;i<ZONES.length;i++){ if(level<ZONES[i].max){ z=i; break; } }
    if(z!==lastZone){
      const Z=ZONES[z];
      document.documentElement.style.setProperty('--accent', getComputedStyle(document.documentElement).getPropertyValue(Z.var));
      document.documentElement.style.setProperty('--accent-soft', getComputedStyle(document.documentElement).getPropertyValue(Z.soft));
      statusEl.textContent = Z.label;
      // 進入「太吵」播提醒音
      if(z===3 && lastZone<3 && soundTgl.checked) beep();
      lastZone=z;
    }
  }

  function drawFace(level){
    const f = faceAt(level);
    faceCircle.setAttribute('fill', f.color);

    // 眼睛交叉淡入淡出（笑眼 ↔ 圓點）
    eyeArcL.style.opacity = f.happy;  eyeArcR.style.opacity = f.happy;
    eyeDotL.style.opacity = 1-f.happy; eyeDotR.style.opacity = 1-f.happy;
    // 擔心/生氣時眼睛睜大一點
    const r = 9 + (1-f.happy)*2.5;
    eyeDotL.setAttribute('r', r); eyeDotR.setAttribute('r', r);

    // 眉毛濃度與角度（內側 y 隨 browTilt 變動）
    browL.style.opacity = f.brow; browR.style.opacity = f.brow;
    const outY = 84, inY = 84 + f.browTilt;        // 左眉內側=右端(x104)，右眉內側=左端(x136)
    browL.setAttribute('y1', outY); browL.setAttribute('y2', inY);
    browR.setAttribute('y1', outY); browR.setAttribute('y2', inY);

    // 嘴：唇線弧度（控制點在中央）
    const my=158, mc=120, mw=32;
    mouthLips.setAttribute('d','M'+(mc-mw)+' '+my+' Q'+mc+' '+(my+f.mouth)+' '+(mc+mw)+' '+my);
    mouthLips.style.opacity = 1 - f.open;
    // 嘴：張開（大叫）
    mouthOpen.style.opacity = f.open;
    mouthOpen.setAttribute('ry', 8 + f.open*16);
    mouthOpen.setAttribute('rx', 18 + f.open*6);

    // 腮紅
    cheekL.style.opacity = f.cheek*0.85; cheekR.style.opacity = f.cheek*0.85;

    // 臉部隨音量微微放大 + 太吵時抖動
    let scale = 1 + level*0.05;
    let shake = level>0.78 ? (Math.random()-0.5)*level*5 : 0;
    faceSvg.style.transform = 'scale('+scale.toFixed(3)+') translate('+shake.toFixed(1)+'px,'+shake.toFixed(1)+'px)';

    // 指針
    needle.style.left = (Math.min(1,level)*100).toFixed(1)+'%';
  }

  // ---- 提醒音 ----
  let beepCtx=null;
  function beep(){
    try{
      beepCtx = beepCtx || new (window.AudioContext||window.webkitAudioContext)();
      const o=beepCtx.createOscillator(), g=beepCtx.createGain();
      o.type='sine'; o.frequency.value=660;
      g.gain.setValueAtTime(0.0001, beepCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.25, beepCtx.currentTime+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, beepCtx.currentTime+0.4);
      o.connect(g).connect(beepCtx.destination);
      o.start(); o.stop(beepCtx.currentTime+0.42);
    }catch(e){}
  }

  // ---- 麥克風 / 音量分析 ----
  let audioCtx, analyser, micStream, data, raf, running=false;
  let smooth=0;
  let wakeLock=null;

  async function start(){
    try{
      micStream = await navigator.mediaDevices.getUserMedia({
        audio:{ echoCancellation:false, noiseSuppression:false, autoGainControl:false }
      });
      audioCtx = new (window.AudioContext||window.webkitAudioContext)();
      if(audioCtx.state==='suspended') await audioCtx.resume();
      const src = audioCtx.createMediaStreamSource(micStream);
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 1024;
      src.connect(analyser);
      data = new Uint8Array(analyser.fftSize);
      running = true;
      overlay.classList.add('hidden');
      stage.hidden = false;
      requestWakeLock();
      loop();
    }catch(err){
      hint.innerHTML = '<span class="err">無法使用麥克風。</span><br>'+
        '請確認已允許麥克風權限。<br>'+
        '若是直接開啟檔案（file://）而非用 https 網址，iPad Safari 會擋下麥克風 —— 請改用 https 網址開啟（見下方說明）。';
    }
  }

  function loop(){
    analyser.getByteTimeDomainData(data);
    let sum=0;
    for(let i=0;i<data.length;i++){ const v=(data[i]-128)/128; sum+=v*v; }
    const rms = Math.sqrt(sum/data.length);

    const gain = 2 + Number(sensInput.value)*3.2;   // 靈敏度 1~10 → 增益
    const target = Math.min(1, rms*gain);

    // 快上慢下：吵起來反應快，安靜後慢慢降
    smooth += (target>smooth ? (target-smooth)*0.35 : (target-smooth)*0.08);

    applyZone(smooth);
    drawFace(smooth);
    raf = requestAnimationFrame(loop);
  }

  function stop(){
    running=false;
    if(raf) cancelAnimationFrame(raf);
    if(micStream) micStream.getTracks().forEach(t=>t.stop());
    if(audioCtx) audioCtx.close().catch(()=>{});
    releaseWakeLock();
    stage.hidden=true;
    overlay.classList.remove('hidden');
    smooth=0; lastZone=-1;
  }

  // ---- 螢幕恆亮 ----
  async function requestWakeLock(){
    try{ if('wakeLock' in navigator){ wakeLock = await navigator.wakeLock.request('screen'); } }catch(e){}
  }
  function releaseWakeLock(){ try{ if(wakeLock){ wakeLock.release(); wakeLock=null; } }catch(e){} }
  document.addEventListener('visibilitychange', ()=>{ if(running && document.visibilityState==='visible') requestWakeLock(); });

  // ---- 全螢幕 ----
  function toggleFs(){
    const el=document.documentElement;
    if(!document.fullscreenElement && !document.webkitFullscreenElement){
      (el.requestFullscreen||el.webkitRequestFullscreen||function(){}).call(el);
    }else{
      (document.exitFullscreen||document.webkitExitFullscreen||function(){}).call(document);
    }
  }

  // ---- 綁定 ----
  startBtn.addEventListener('click', start);
  stopBtn.addEventListener('click', stop);
  fsBtn.addEventListener('click', toggleFs);
  sensInput.addEventListener('input', ()=>{ try{ localStorage.setItem('nm_sens', sensInput.value); }catch(e){} });
  soundTgl.addEventListener('change', ()=>{ try{ localStorage.setItem('nm_alert', soundTgl.checked?'1':'0'); }catch(e){} });

})();
</script>
</body>
</html>
